spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

feature:
  cache-enabled: ${FEATURE_CACHE_ENABLED:true}
  async-clicks-enabled: ${FEATURE_ASYNC_CLICKS_ENABLED:true}

app:
  cache:
    url-ttl-seconds: ${APP_CACHE_URL_TTL_SECONDS:3600}
  click-aggregation:
    flush-interval-ms: ${APP_CLICK_AGGREGATION_FLUSH_INTERVAL_MS:10000}
  datasource:
    pool:
      maximum-size: 20
      minimum-idle: 5
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      auto-commit: false
      connection-test-query: SELECT 1
      name: URLShortenerHikariPool
    prepared-statements:
      cache: true
      cache-size: 250
      sql-limit: 2048
      use-server-prepared-statements: true

server:
  port: 8080

