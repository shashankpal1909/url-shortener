spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  datasource:
    pool:
      maximum-size: 20
      minimum-idle: 5
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      auto-commit: true
      connection-test-query: SELECT 1
      name: URLShortenerHikariPool
    prepared-statements:
      cache: true
      cache-size: 250
      sql-limit: 2048
      use-server-prepared-statements: true

server:
  port: 8080

