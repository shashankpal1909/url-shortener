spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

feature:
  cache-enabled: ${FEATURE_CACHE_ENABLED:true}
  async-clicks-enabled: ${FEATURE_ASYNC_CLICKS_ENABLED:true}

app:
  cache:
    url-ttl-seconds: ${APP_CACHE_URL_TTL_SECONDS:3600}
    negative-ttl-seconds: ${APP_CACHE_NEGATIVE_TTL_SECONDS:300}
  click-aggregation:
    flush-interval-ms: ${APP_CLICK_AGGREGATION_FLUSH_INTERVAL_MS:10000}
  datasource:
    pool:
      maximum-size: 20
      minimum-idle: 5
      connection-timeout-ms: 30000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      auto-commit: false
      connection-test-query: SELECT 1
      name: URLShortenerHikariPool
    prepared-statements:
      cache: true
      cache-size: 250
      sql-limit: 2048
      use-server-prepared-statements: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,threaddump,heapdump,conditions
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        url.redirect.latency: true
        url.shorten.latency: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
        url.redirect.latency: 0.5,0.9,0.95,0.99
        url.shorten.latency: 0.5,0.9,0.95,0.99
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
  tracing:
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

